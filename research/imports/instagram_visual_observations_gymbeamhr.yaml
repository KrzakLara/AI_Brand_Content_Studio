# MANUAL VISUAL OBSERVATIONS - NOT produced by the studio runtime. See provenance.
provenance:
  observer: Claude Code operator session (development time) - NOT the studio runtime and NOT a vision model run
    by the studio
  method: Cover images (video cover frame / first carousel slide) were downloaded from the Instagram CDN URLs returned
    by the Apify export, viewed on two labelled contact sheets of 7 covers each (about 400 px per cover), and labelled
    by eye. Palettes were computed from the same bytes with studio.tools.imagecheck.dominant_colors.
  observed_at: '2026-10-27'
  palette_method: median-cut quantisation, k=5 per cover on a 96 px thumbnail (Pillow); shares are pixel fractions
  images_stored: NO - cover images are third-party media; only their sha256 is recorded here
  selection: 14 of the 30 imported posts, chosen for variety (reels, carousels, one image; product and non-product);
    the other 16 were not analysed
  limitations: thumbnail-scale viewing; first frame/slide only; labels are subjective; tone is not assessed here
