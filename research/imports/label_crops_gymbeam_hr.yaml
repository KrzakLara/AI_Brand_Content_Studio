# OPERATOR-LABELLED LABEL CROPS of the selected original packshot. Nothing here is generated or redrawn.
provenance:
  observer: Claude Code operator session (development time, 2026-10-28) - NOT a studio runtime vision model
  method: >-
    the stored original packshot was viewed at 1:1 and zoomed; badge circles were located by pixel analysis (colour runs at x=880), pack-face
    regions by eye; each crop was rendered and checked. PROVENANCE AUDIT (2026-10-28): for every crop the origin of its pixels was determined by
    inspecting the image - is it printed on the pouch itself, or a separate graphic placed around the product in the webshop image?
  status: manual
  source_url: https://gymbeam.hr/media/catalog/product/cache/70f742f66feec18cb83790f14444a3d1/c/r/creatine-monohydrate-unflavoured-01_8.jpg
  source_sha256: 99543edff63b17e355cd7bfcc734ef364ae81f08304e561e6a347c09e8954f1c   # the selected original packshot, 1080x1080
  pack_generation: new
  flavour_shown: Unflavoured
  size_printed: none   # no weight is printed on the front: a gram quantity can NOT be matched to this image
  origin_values:
    physical_packaging: the pixels are the print on the pouch itself (inside the pouch outline)
    webshop_graphic: a separate graphic (e.g. a round badge) placed around/over the pouch edge in the official webshop image; not packaging print
    uncertain: origin could not be established; neither "Na pakiranju piše" nor "Na stranici proizvoda piše" may be asserted
  note: crops are rectangles cut from the original by code at production time (box = x0,y0,x1,y1 in source pixels); never upscaled
    beyond max_upscale; never recoloured, re-typeset or extended.
crops:
- id: label_name
  box: [270, 380, 762, 500]
  usable: true
  origin: physical_packaging
  origin_basis: "white band of the pouch front, entirely inside the pouch outline; no overlay graphics in the box"
  shows: "'Creatine Monohydrate' on the white band of the pack front"
  printed_text: ["Creatine Monohydrate"]
  max_upscale: 2.0
- id: label_purity
  box: [270, 500, 762, 605]
  usable: true
