[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-brand-content-studio"
version = "0.1.0"
description = "AI Brand Content Studio - Phase 1 walking skeleton (mock providers)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
