[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-brand-content-studio"
version = "0.1.0"
description = "AI Brand Content Studio - Phase 1 walking skeleton (mock providers)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
images = ["pillow>=10"]   # optional: palette extraction, transparency check, background cut-out
dev = ["pytest>=8", "pillow>=10"]
# local post-production scripts in plans/gymbeam_hr/ (reel/carousel edits, cover/footer/snap work, methodology PDF); no API key needed
media = ["pillow>=10", "numpy", "imageio-ffmpeg", "opencv-python-headless", "reportlab"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
