name: no-claude-local-files

# Fails if anything under .claude/ OTHER than .claude/skills/ is tracked, including files
# force-added with `git add -f` despite .gitignore (settings.local.json, caches, sessions...).
# .claude/skills/ is intentionally part of the repository.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if local Claude files are tracked
        shell: bash
        run: |
          tracked="$(git ls-files -- '.claude' ':(icase).claude/**' | grep -v -i '^\.claude/skills/' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Local Claude Code files are tracked and must be removed from Git (only .claude/skills/ may be tracked):"
            echo "$tracked"
            echo "Fix: git rm -r --cached <path> && git commit"
            exit 1
          fi
          echo "OK: only .claude/skills/ (if anything) is tracked under .claude/."
